<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daily Market Summary — US session 2026-11-25</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    /* ─── RESET ──────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ─── DARK MODE BASE ─────────────────────────────────────────── */
    body {
      background-color: #000000;
      color: #e0e0e0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    /* ─── UNIVERSAL IMAGE RULE ───────────────────────────────────── */
    img {
      max-width: 100%;
      height: auto;
      display: block;
      margin: 0 auto;
      border-radius: 4px;
    }

    /* ─── CSS VARIABLES ──────────────────────────────────────────── */
    :root {
      --bg-card:    #161616;
      --bg-card2:   #1c1c1c;
      --bg-head:    #111111;
      --border:     #2a2a2a;
      --border-lt:  #1e1e1e;
      --text-muted: #777777;
      --text-label: #aaaaaa;
      --green:      #4caf50;
      --green-bg:   rgba(76,175,80,0.13);
      --red:        #f44336;
      --red-bg:     rgba(244,67,54,0.13);
      --amber:      #ff9800;
      --amber-bg:   rgba(255,152,0,0.11);
      --blue:       #42a5f5;
    }

    /* ─── DYNAMIC COLOR CLASSES ──────────────────────────────────── */
    .text-green, .up   { color: var(--green) !important; }
    .text-red,   .down { color: var(--red)   !important; }
    .text-amber        { color: var(--amber) !important; }
    .text-muted        { color: var(--text-muted) !important; }
    .text-green-bg { background: var(--green-bg); color: var(--green) !important; }
    .text-red-bg   { background: var(--red-bg);   color: var(--red)   !important; }
    .na-val { color: var(--text-muted); font-style: italic; font-size: 11px; }

    /* ─── LAYOUT ─────────────────────────────────────────────────── */
    .page-wrap { max-width: 1100px; margin: 0 auto; padding: 0 16px 48px; }

    /* ─── HEADER ─────────────────────────────────────────────────── */
    .report-header {
      background: var(--bg-head);
      border-bottom: 1px solid var(--border);
      padding: 18px 24px 14px;
      margin-bottom: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }
    .report-header h1 { font-size: 20px; font-weight: 700; color: #fff; letter-spacing: -0.3px; }
    .report-header .subtitle { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
    .ts-badges { display: flex; gap: 8px; flex-wrap: wrap; }
    .ts-badge {
      background: var(--bg-card2);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 4px 10px;
      font-size: 11px;
      color: var(--text-label);
      white-space: nowrap;
    }
    .ts-badge span { color: #e0e0e0; font-weight: 500; }

    /* ─── SECTIONS ───────────────────────────────────────────────── */
    .section { margin-bottom: 28px; }
    .section-title {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: var(--text-muted);
      border-left: 3px solid #333;
      padding-left: 10px;
      margin-bottom: 14px;
    }
    .sub-title {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: var(--text-muted);
      margin: 16px 0 10px;
    }

    /* ─── DATA WARNING BANNER ─────────────────────────────────────────────── */
    .data-warning-banner {
      display: none;
      background: rgba(255,152,0,0.12);
      border: 1px solid rgba(255,152,0,0.4);
      border-radius: 6px;
      padding: 10px 16px;
      margin-bottom: 16px;
      font-size: 12px;
      font-weight: 600;
      color: var(--amber);
      line-height: 1.5;
    }
    .data-warning-banner.active { display: block; }

    /* ─── TABLE BASE ───────────────────────────────────────────────────── */
    .table-wrap {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow-x: auto;   /* KEY FIX: 手機横向滚動 */
      -webkit-overflow-scrolling: touch;
    }
    .data-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
    .data-table th {
      background: var(--bg-head);
      color: var(--text-muted);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      padding: 8px 10px;
      text-align: right;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    .data-table th:first-child { text-align: left; }
    .data-table td {
      padding: 8px 10px;
      text-align: right;
      border-bottom: 1px solid var(--border-lt);
      color: #e0e0e0;
      white-space: nowrap;
    }
    .data-table td:first-child { text-align: left; }
    .data-table tbody tr:hover { background: var(--bg-card2); }
    .data-table tbody tr:last-child td { border-bottom: none; }

    /* ─── SECTION 1: MACRO CARDS ─────────────────────────────────── */
    .macro-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 10px;
    }
    @media (max-width: 900px) { .macro-grid { grid-template-columns: repeat(3, 1fr); } }
    @media (max-width: 500px) { .macro-grid { grid-template-columns: repeat(2, 1fr); } }
    .macro-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 14px 14px 12px;
    }
    .mc-label { font-size: 9px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: var(--text-muted); margin-bottom: 2px; }
    .mc-sub   { font-size: 9px; color: #555; margin-bottom: 6px; }
    .mc-price { font-size: 21px; font-weight: 700; color: #fff; letter-spacing: -0.5px; line-height: 1.1; }
    .mc-chg   { font-size: 12px; font-weight: 500; margin-top: 4px; }

    /* ─── SECTION 3: INDICES ─────────────────────────────────────── */
    .sym-cell .sym { font-size: 14px; font-weight: 700; color: #fff; }
    .sym-cell .sym-name { font-size: 10px; color: var(--text-muted); margin-top: 1px; }
    .chg-pill {
      display: inline-block;
      padding: 2px 7px;
      border-radius: 3px;
      font-size: 11.5px;
      font-weight: 600;
    }
    .rsi-wrap { display: flex; align-items: center; gap: 6px; justify-content: flex-end; }
    .rsi-track { width: 56px; height: 5px; background: #333; border-radius: 3px; overflow: hidden; }
    .rsi-fill  { height: 100%; border-radius: 3px; }
    .rsi-ob    { background: var(--red); }
    .rsi-os    { background: var(--green); }
    .rsi-neu   { background: var(--blue); }
    .rsi-ob-cell { background: rgba(244,67,54,0.10); }
    .rsi-os-cell { background: rgba(76,175,80,0.10); }
    .status-badge {
      display: inline-block;
      font-size: 9.5px;
      font-weight: 600;
      letter-spacing: 0.4px;
      padding: 2px 7px;
      border-radius: 3px;
      text-transform: uppercase;
    }
    .badge-above { background: var(--green-bg); color: var(--green); }
    .badge-below { background: var(--red-bg);   color: var(--red);   }
    .badge-mixed { background: var(--amber-bg); color: var(--amber); }

    /* ─── SECTION 2: SENTIMENT ───────────────────────────────────── */
    .sentiment-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }
    @media (max-width: 700px) { .sentiment-grid { grid-template-columns: 1fr; } }
    .sent-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 16px;
    }
    .sc-label  { font-size: 9px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: var(--text-muted); margin-bottom: 8px; }
    .sc-value  { font-size: 30px; font-weight: 700; letter-spacing: -1px; line-height: 1; margin-bottom: 4px; }
    .sc-rating { font-size: 11px; font-weight: 500; text-transform: capitalize; margin-bottom: 12px; }
    .sc-sub    { font-size: 10px; color: var(--text-muted); margin-bottom: 8px; }
    .hist-table { width: 100%; border-collapse: collapse; margin-top: 6px; }
    .hist-table td { padding: 3px 0; font-size: 11px; color: var(--text-label); border-bottom: 1px solid var(--border-lt); }
    .hist-table td:last-child { text-align: right; color: #e0e0e0; font-weight: 500; }
    .hist-table tr:last-child td { border-bottom: none; }
    /* ─── SECTION 4: BREADTH ─────────────────────────────────────── */
    .breadth-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    @media (max-width: 700px) { .breadth-grid { grid-template-columns: 1fr; } }
    .pct-bar-wrap { display: flex; align-items: center; gap: 6px; justify-content: flex-end; }
    .pct-bar-track { width: 70px; height: 5px; background: #333; border-radius: 3px; overflow: hidden; }
    .pct-bar-red   { height: 100%; border-radius: 3px; background: var(--red); }
    .pct-bar-amber { height: 100%; border-radius: 3px; background: var(--amber); }
    .pct-bar-green { height: 100%; border-radius: 3px; background: var(--green); }

    /* ─── IMAGE BLOCKS ───────────────────────────────────────────── */
    .img-block {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px;
      margin-top: 14px;
    }
    .img-caption { font-size: 10px; color: var(--text-muted); text-align: center; margin-top: 8px; }

    /* ─── AI TEXT AREA ───────────────────────────────────────────── */
    .ai-text-area {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 20px 22px;
      min-height: 90px;
      font-size: 13px;
      line-height: 1.7;
      white-space: pre-wrap;
    }
    .ai-placeholder { color: var(--text-muted); font-style: italic; font-size: 12px; }

    /* ─── VISUAL TAGS (vs MA) ────────────────────────────────────── */
    .vtag {
      display: inline-block;
      padding: 2px 7px;
      border-radius: 3px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.3px;
    }
    .vtag-above { background: var(--green-bg); color: var(--green); }
    .vtag-below { background: var(--red-bg);   color: var(--red);   }
    .vtag-near  { background: var(--amber-bg); color: var(--amber); }

    /* ─── LOGIC INFO BUTTON & MODAL ─────────────────────────────── */
    .logic-info-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: rgba(66,165,245,0.12);
      border: 1px solid rgba(66,165,245,0.35);
      border-radius: 4px;
      padding: 2px 8px;
      font-size: 10px;
      font-weight: 600;
      color: var(--blue);
      cursor: pointer;
      letter-spacing: 0.4px;
      text-transform: uppercase;
      margin-left: 8px;
      vertical-align: middle;
      transition: background 0.15s;
      user-select: none;
    }
    .logic-info-btn:hover { background: rgba(66,165,245,0.22); }
    .logic-info-btn .li-icon { font-size: 11px; }

    /* Logic Info Inline Note */
    .logic-note {
      font-size: 10.5px;
      color: var(--text-muted);
      background: rgba(66,165,245,0.06);
      border-left: 2px solid rgba(66,165,245,0.4);
      border-radius: 0 4px 4px 0;
      padding: 6px 10px;
      margin: 6px 0 10px;
      line-height: 1.6;
    }
    .logic-note strong { color: #90caf9; }

    /* Logic Info Modal Overlay */
    .li-modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.72);
      z-index: 9990;
      align-items: center;
      justify-content: center;
    }
    .li-modal-overlay.active { display: flex; }
    .li-modal {
      background: #141420;
      border: 1.5px solid #42a5f5;
      border-radius: 10px;
      padding: 26px 28px 22px;
      max-width: 560px;
      width: 90%;
      box-shadow: 0 0 40px rgba(66,165,245,0.2);
      position: relative;
    }
    .li-modal h3 {
      color: #42a5f5;
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .li-modal p {
      color: #d0d0d0;
      font-size: 12.5px;
      line-height: 1.75;
      margin-bottom: 10px;
    }
    .li-modal .formula-box {
      background: #0d0d1a;
      border: 1px solid #2a2a4a;
      border-radius: 6px;
      padding: 10px 14px;
      font-size: 12px;
      color: #90caf9;
      font-family: 'Courier New', monospace;
      margin: 10px 0 14px;
      line-height: 1.6;
    }
    .li-modal .li-close-btn {
      background: #42a5f5;
      color: #000;
      border: none;
      padding: 7px 20px;
      border-radius: 5px;
      font-weight: 700;
      cursor: pointer;
      font-size: 12px;
      margin-top: 6px;
    }
    .li-modal .li-close-btn:hover { background: #64b5f6; }

    /* RS Score Rating Badge */
    .rs-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 3px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.3px;
    }
    .rs-elite  { background: rgba(76,175,80,0.2);  color: #66bb6a; }
    .rs-strong { background: rgba(76,175,80,0.12); color: #81c784; }
    .rs-mid    { background: rgba(255,152,0,0.12); color: #ffa726; }
    .rs-weak   { background: rgba(244,67,54,0.12); color: #ef5350; }

    /* Hot Cluster Badge */
    .cluster-hot  { background: rgba(255,87,34,0.18); color: #ff7043; border: 1px solid rgba(255,87,34,0.3); }
    .cluster-warm { background: rgba(255,152,0,0.12); color: #ffa726; border: 1px solid rgba(255,152,0,0.25); }
    .cluster-cool { background: rgba(100,100,100,0.12); color: #9e9e9e; border: 1px solid rgba(100,100,100,0.2); }
    .cluster-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 3px;
      font-size: 11px;
      font-weight: 700;
    }

    /* Volume Climax Card */
    .anomaly-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px 14px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .anomaly-sym {
      font-size: 15px;
      font-weight: 700;
      color: #fff;
      min-width: 52px;
    }
    .anomaly-detail {
      font-size: 11px;
      color: var(--text-label);
      flex: 1;
    }
    .anomaly-tag {
      font-size: 10px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 3px;
      background: rgba(255,152,0,0.15);
      color: var(--amber);
      border: 1px solid rgba(255,152,0,0.3);
    }

    /* ─── MOBILE RESPONSIVE ─────────────────────────────────────────────────── */
    /* 手機上隱藏次要欄位（RSI / MA / 1M% / 3M%） */
    @media (max-width: 600px) {
      .hide-on-mobile { display: none !important; }
      .data-table { font-size: 11.5px; }
      .data-table td, .data-table th { padding: 7px 8px; }
      .mc-price { font-size: 17px; }
      .page-wrap { padding: 0 10px 36px; }
      .report-header { padding: 12px 14px 10px; }
      .report-header h1 { font-size: 16px; }
      .li-modal { padding: 18px 16px 16px; }
      .li-modal p { font-size: 12px; }
    }

    /* ─── FOOTER ────────────────────────────────────────────────────────────────── */
    .report-footer {
      margin-top: 36px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
      text-align: center;
      font-size: 10px;
      color: var(--text-muted);
      line-height: 1.8;
    }

    /* Mobile Table Column Hiding - Fixed Alignment (Grok v5.1) */
    @media (max-width: 600px) {
      .hide-on-mobile {
        display: none !important;
      }

      .table-wrap {
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: thin;
      }

      .data-table th,
      .data-table td {
        white-space: nowrap;
        padding: 8px 6px;
      }
    }

  
    /* charts copied with the Section 7 figures; same dark palette */
    .src-note {
      font-size: 12px;
      color: var(--text-muted);
      margin: 0 0 12px;
      max-width: 820px;
      line-height: 1.45;
    }
    .src-note a { color: var(--blue); }
    .data-table td.wrap { white-space: normal; text-align: left; }
    .mom-bar {
      width: 88px;
      height: 7px;
      background: #2a2a2a;
      border-radius: 4px;
      overflow: hidden;
      display: inline-block;
      vertical-align: middle;
    }
    .mom-bar > span {
      display: block;
      height: 100%;
      background: var(--blue);
      border-radius: 4px;
    }
    .mom-chart {
      position: relative;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px 8px 4px;
    }
    .mom-chart svg { width: 100%; height: auto; display: block; }
    svg.hover-chart { cursor: crosshair; }
    .chart-tip {
      position: fixed;
      z-index: 30;
      display: none;
      pointer-events: none;
      background: #1c1c1c;
      border: 1px solid #3a3a3a;
      color: #e0e0e0;
      font-size: 11px;
      line-height: 1.35;
      padding: 5px 8px;
      border-radius: 4px;
      max-width: 340px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.5);
    }

  </style>
</head>
<body>

<!-- HEADER -->
<div class="report-header">
  <div>
    <h1>Daily Market Summary</h1>
    <div class="subtitle">Momentum Swing Trading Coach &middot; 2026-11-25</div>
  </div>
  <div class="ts-badges">
    <div class="ts-badge">HKT <span>2026-11-26 12:32</span></div>
    <div class="ts-badge">ET <span>2026-11-25 23:32</span></div>
  </div>
</div>
