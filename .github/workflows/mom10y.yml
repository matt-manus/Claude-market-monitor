name: 10-year momentum share (monthly)

# Rebuilds data/monitor/mom10y.csv. Heavy download; runs on the 1st of each month.
on:
  schedule:
    - cron: '17 4 1 * *'
  workflow_dispatch:

concurrency:
  group: mom10y
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: pip install "yfinance>=0.2.40" pandas numpy requests lxml
      - name: Build
        run: python scripts/market_monitor/mom10y.py
      - name: Commit
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/monitor/mom10y.csv
          git commit -m "10y momentum share $(date -u +%Y-%m-%d)" || exit 0
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && break; sleep 10; done
