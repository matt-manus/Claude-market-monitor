name: Probe (one-off)
on:
  push:
    branches: [ main ]
    paths: [ 'tools/stockbee_probe.py', '.github/workflows/probe.yml' ]
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install requests
      - run: python tools/stockbee_probe.py
      - name: Chrome screenshot test
        run: |
          google-chrome --version
          google-chrome --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=1400,1000 --screenshot=/tmp/sb.png "https://docs.google.com/spreadsheets/d/1O6OhS7ciA8zwfycBfGPbP2fWJnR0pn2UUvFZVDP9jpE/pubhtml" && ls -la /tmp/sb.png
      - name: Keep screenshot on branch probe
        run: |
          git config --global user.name "github-actions[bot]"; git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -q --orphan probe && git rm -rq --cached . && cp /tmp/sb.png sb.png && git add sb.png && git commit -qm probe && git push -fq origin probe
